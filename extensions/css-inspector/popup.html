<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>CSS Inspector</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="header">
    <h1>CSS Inspector & Editor</h1>
    <p>Click elements to inspect and live-edit their styles</p>
  </div>
  <div class="body">
    <button id="btn-open">Open CSS Inspector</button>
    <ul class="tips">
      <li>Hover any element to highlight it</li>
      <li>Click to select and inspect</li>
      <li>Edit values directly in the panel</li>
      <li>Use "Copy Styles" to copy computed CSS</li>
    </ul>
  </div>
  <script src="popup.js"></script>
</body>
</html>
