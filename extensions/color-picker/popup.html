<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Color Picker</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="header">
    <h1>Color Picker & Palette</h1>
  </div>

  <div class="pick-area">
    <button id="btn-pick">Pick Color from Page</button>
    <p class="hint">Picked color is copied to clipboard</p>
  </div>

  <div class="palette-header">
    <span>Saved Palette</span>
    <button id="btn-clear-palette">Clear</button>
  </div>

  <div id="palette"></div>

  <script src="popup.js"></script>
</body>
</html>
